# Al-Khal reverse proxy
# Domains:
#   https://adminalkhal.qmenussy.com  → Next dashboard (127.0.0.1:4006)
#   https://apialkhal.qmenussy.com    → Nest API      (127.0.0.1:4005)
#
# Install:
#   sudo cp deploy/nginx/alkhal.conf /etc/nginx/sites-available/alkhal
#   sudo ln -sf /etc/nginx/sites-available/alkhal /etc/nginx/sites-enabled/alkhal
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue certs with certbot (see deploy steps).

# ---- Dashboard ----
server {
    listen 80;
    listen [::]:80;
    server_name adminalkhal.qmenussy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminalkhal.qmenussy.com;

    # Managed by Certbot after: certbot --nginx -d adminalkhal.qmenussy.com
    ssl_certificate     /etc/letsencrypt/live/adminalkhal.qmenussy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adminalkhal.qmenussy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---- API ----
